plugins {
    alias(libs.plugins.android.application)
}

def localConfig = new Properties()
def localConfigFile = rootProject.file('local.properties')
if (localConfigFile.exists()) {
    localConfigFile.withInputStream { localConfig.load(it) }
}

android {
    buildFeatures { buildConfig = true }
    namespace 'com.luoyilin.focusguard'
    compileSdk {
        version = release(36) {
            minorApiLevel = 1
        }
    }

    defaultConfig {
        buildConfigField 'String', 'API_BASE_URL', groovy.json.JsonOutput.toJson(providers.gradleProperty('focusguardApiUrl').getOrElse(localConfig.getProperty('focusguard.apiUrl', 'http://192.168.10.21:8080/')))
        applicationId "com.luoyilin.focusguard"
        buildConfigField 'String', 'WECHAT_APP_ID', groovy.json.JsonOutput.toJson(providers.gradleProperty('focusguardWechatAppId').getOrElse('wxbc866bf990e09da5'))
        minSdk 26
        targetSdk 36
        versionCode 1
        versionName "1.0"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }
}

dependencies {
    implementation 'com.tencent.mm.opensdk:wechat-sdk-android:6.8.40'
    implementation 'androidx.viewpager:viewpager:1.0.0'
    implementation libs.activity.ktx
    implementation libs.appcompat
    implementation libs.constraintlayout
    implementation libs.material
    testImplementation libs.junit
    // Real JSON implementation for portable backup validation and recovery tests on the JVM.
    testImplementation 'org.json:json:20240303'
    androidTestImplementation libs.espresso.core
    androidTestImplementation libs.ext.junit
    implementation libs.retrofit.core
    implementation libs.retrofit.gson.converter
}
